name: Push Notification Reminders

on:
  schedule:
    # JST 08:00, 08:30, 09:00 (UTC 23:00, 23:30, 00:00)
    - cron: '0,30 23 * * *'
    - cron: '0 0 * * *'
    # JST 12:00, 12:30, 13:00 (UTC 03:00, 03:30, 04:00)
    - cron: '0,30 3 * * *'
    - cron: '0 4 * * *'
    # JST 19:30, 20:00, 20:30, 21:00, 21:30 (UTC 10:30, 11:00, 11:30, 12:00, 12:30)
    - cron: '30 10 * * *'
    - cron: '0,30 11 * * *'
    - cron: '0,30 12 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder dispatch
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_CRON_SECRET" ]; then
            echo "REMINDER_CRON_SECRET is not configured in GitHub Secrets; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "https://pfc-calorie-tracker.vercel.app/api/send-reminders" \
            -H "Authorization: Bearer ${REMINDER_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
